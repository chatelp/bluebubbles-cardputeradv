; BlueBubbles Cardputer — client iMessage léger pour M5Stack Cardputer ADV.
; Même socle que les précédents projets Cardputer ADV (Daoa Mini, Geek Casino) :
; Arduino-ESP32 core 3.x via pioarduino, application unique plein flash.

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
build_src_filter = +<*> -<main_sim.cpp> -<sim_compat/>
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = m5stack-stamps3
; TLS + HTTP + M5GFX dépassent la partition OTA par défaut. Ni OTA ni SPIFFS.
board_build.partitions = max_app_8MB.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Cardputer@^1.1.1
    bblanchon/ArduinoJson@^7.2.0
monitor_speed = 115200

; Tests natifs des décodeurs de flux et de la clé de fusion : même code que
; le firmware (include/bb_streams.h), exécuté sur le Mac. `pio test -e test-native`
[env:test-native]
platform = native
build_flags = -std=c++17 -Iinclude
lib_deps = bblanchon/ArduinoJson@^7.2.0
lib_compat_mode = off
build_src_filter = -<*>

; ------------------------------------------------- simulateur macOS (SDL2)
; Rendu au pixel identique à l'appareil : même API lgfx, même police efont.
; `pio run -e sim` puis .pio/build/sim/program [--screens <dir>] [--lang fr]
[env:sim]
platform = native
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    bblanchon/ArduinoJson@^7.0.4
lib_compat_mode = off
build_type = debug
build_src_filter = +<ui/> +<main_sim.cpp>
build_flags =
    -std=c++17
    -DSIM_BUILD
    -DLGFX_USE_V1
    -DLGFX_SDL
    -Iinclude
    -Isrc
    -Isrc/sim_compat
    -I/opt/homebrew/include
    -I/opt/homebrew/include/SDL2
    -L/opt/homebrew/lib
    -lSDL2
